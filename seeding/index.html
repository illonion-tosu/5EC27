<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seeding</title>

    <link rel="stylesheet" href="../_shared/css/common.css">
    <link rel="stylesheet" href="style.css">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="overlay">
        <div class="background-image"></div>

        <!-- Team Info -->
        <img class="team-flag" src="https://osuflags.omkserver.nl/ES-1000.png">
        <div class="team-name">Spain</div>
        <div class="seed-text">Seed</div>
        <div class="seed-number">#12</div>

        <!-- Last Year Info -->
        <div class="last-year-information-container">
            <div>
                <div class="last-year-information-text">Last Year Placement</div>
                <div class="last-year-information-number">#3</div>
            </div>
            <div>
                <div class="last-year-information-text">Last Year Seed</div>
                <div class="last-year-information-number">#12</div>
            </div>
        </div>

        <!-- Mods -->
        <div class="mods-container">
            <div class="mod-container">
                <div class="nm-mod">NM1</div>
                <div class="nm-mod">NM2</div>
                <div class="nm-mod">NM3</div>
                <div class="nm-mod">NM4</div>
                <div class="nm-mod">NM5</div>
            </div>
            <div class="mod-container non-nm-mod-container">
                <div class="hd-mod">HD1</div>
                <div class="hd-mod">HD2</div>
            </div>
            <div class="mod-container non-nm-mod-container">
                <div class="hr-mod">HR1</div>
                <div class="hr-mod">HR2</div>
            </div>
            <div class="mod-container dt-mod-container">
                <div class="dt-mod">DT1</div>
                <div class="dt-mod">DT2</div>
                <div class="dt-mod">DT3</div>
            </div>
        </div>

        <!-- Players -->
        <div class="player-rank-container">
            <div class="player-container">
                <div>Player1</div>
                <div>Player2</div>
                <div>Player3</div>
                <div>Player4</div>
                <div>Player5</div>
                <div>Player6</div>
                <div>Player7</div>
                <div>Player8</div>
            </div>
            <div class="rank-container">
                <div>#128</div>
                <div>#218</div>
                <div>#242</div>
                <div>#265</div>
                <div>-</div>
                <div>#5</div>
                <div>#51</div>
                <div>#160</div>
            </div>
        </div>
    </div>
</body>
</html>
