<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schedule</title>

    <link rel="stylesheet" href="../_shared/css/common.css" />
    <link rel="stylesheet" href="style.css" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:ital,wght@0,300..700;1,300..700&display=swap"
      rel="stylesheet"
    />

    <script src="../_shared/deps/jquery-4.0.0.min.js"></script>
  </head>
  <body>
    <div class="overlay" id="overlay">
      <div class="background-image"></div>

      <div class="schedule-view" data-schedule="">
        <div class="schedule-container">
          <div class="top-left-text schedule-text">Schedule</div>

          <div class="schedule-matches-box">
            <div class="schedule-recent-matches">
              <div class="schedule-matches-text">Recent Matches</div>
              <div class="schedule-recent-match-container" id="recent-matches">
                <div class="match">
                  <div class="match-box red win">
                    <div class="match-team win">AUT</div>
                    <div class="match-score win">5</div>
                  </div>
                  <div class="match-box blue">
                    <div class="match-team">FIN</div>
                    <div class="match-score">3</div>
                  </div>
                </div>

                <div class="match">
                  <div class="match-box red lower">
                    <div class="match-team">DEU</div>
                    <div class="match-score">5</div>
                  </div>
                  <div class="match-box blue">
                    <div class="match-team">UKR</div>
                    <div class="match-score">3</div>
                  </div>
                </div>

                <div class="match">
                  <div class="match-box red">
                    <div class="match-team">RUS</div>
                    <div class="match-score">5</div>
                  </div>
                  <div class="match-box blue">
                    <div class="match-team">TUR</div>
                    <div class="match-score">3</div>
                  </div>
                </div>

                <div class="match">
                  <div class="match-box red">
                    <div class="match-team">POL</div>
                    <div class="match-score">5</div>
                  </div>
                  <div class="match-box blue">
                    <div class="match-team">POLB</div>
                    <div class="match-score">3</div>
                  </div>
                </div>
              </div>
            </div>

            <div class="schedule-upcoming-matches">
              <div class="schedule-matches-text">Upcoming Matches</div>
              <div
                class="schedule-upcoming-match-container"
                id="upcoming-matches"
              >
                <div class="match">
                  <div class="match-box red lower">
                    <div class="match-team">DEU</div>
                    <div class="match-score">5</div>
                  </div>
                  <div class="match-box blue">
                    <div class="match-team">UKR</div>
                    <div class="match-score">3</div>
                  </div>
                </div>

                <div class="match">
                  <div class="match-box red">
                    <div class="match-team">RUS</div>
                    <div class="match-score">5</div>
                  </div>
                  <div class="match-box blue">
                    <div class="match-team">TUR</div>
                    <div class="match-score">3</div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="schedule-comingUp-match">
            <div class="schedule-matches-text">Coming up next</div>
            <div class="schedule-comingUp-box">
              <div class="schedule-comingUp-match-box" id="coming-up-match">
                <div class="match">
                  <div class="match-box red">
                    <div class="match-team">RUS</div>
                    <div class="match-score">5</div>
                  </div>
                  <div class="match-box blue">
                    <div class="match-team">TUR</div>
                    <div class="match-score">3</div>
                  </div>
                </div>
              </div>
              <div class="round-name" id="round-name">Round of 32</div>
              <div class="schedule-comingUp-teamsVs" id="coming-up-teams">
                Russia B vs Turkey
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="sponsors">
        <img
          class="acrid-sponsor"
          src="../_shared/assets/sponsors/Acrid Covers Logo Beige.png"
        />
        <img
          class="kagami-sponsor"
          src="../_shared/assets/sponsors/Kagami Studio Logo Beige.png"
        />
        <img
          class="sliderpals-sponsor"
          src="../_shared/assets/sponsors/SliderPals Logo Beige.png"
        />
      </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
      <section class="sidebar-section">
        <h1>League</h1>
        <div class="sidebar-button-container">
          <button class="league-button" data-league="major">MAJOR</button>
          <button class="league-button" data-league="minor">MINOR</button>
          <button class="full-width-button" id="refresh-button">REFRESH</button>
        </div>
      </section>
      <section class="sidebar-section">
        <h1>Bracket</h1>
        <p>Click to show now</p>
        <div class="sidebar-button-container">
          <button class="view-button" data-view="upper">UPPER</button>
          <button class="view-button" data-view="lower">LOWER</button>
        </div>
      </section>
      <section class="sidebar-section">
        <h1>Transitions</h1>
        <div class="sidebar-button-container">
          <button class="full-width-button" id="toggle-auto-cycle">
            AUTO CYCLE: <span id="toggle-auto-cycle-text"></span>
          </button>
          <button class="full-width-button" id="toggle-fade">
            FADE: <span id="toggle-fade-text"></span>
          </button>
          <label class="hold-label" for="hold-seconds-input">
            HOLD (SECONDS)
            <input type="number" id="hold-seconds-input" min="1" step="1" />
          </label>
        </div>
        <p id="cycle-countdown"></p>
      </section>
    </div>

    <script src="index.js" type="module"></script>
    <script src="../_shared/core/sponsors.js"></script>
  </body>
</html>
