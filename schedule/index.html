<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schedule</title>

    <link rel="stylesheet" href="../_shared/css/common.css" />
    <link rel="stylesheet" href="style.css" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:ital,wght@0,300..700;1,300..700&display=swap"
      rel="stylesheet"
    />

    <script src="../_shared/deps/jquery-4.0.0.min.js"></script>
  </head>
  <body>
    <video autoplay loop muted class="background-video">
      <source src="../_shared/assets/background.mp4" />
    </video>

    <div class="overlay" id="overlay">
      <!-- Images -->
      <img class="bats-1" src="static/left-wing.png" />
      <img class="logo" src="static/logo.png" />
      <img class="vampire" src="static/vampire.svg" />

      <div class="schedule-view" data-schedule="">
        <div class="schedule-container">
          <div class="top-left-text schedule-text">Schedule</div>

          <div class="schedule-matches-box">
            <div class="schedule-recent-matches">
              <div class="schedule-matches-text">Recent Matches</div>
              <div
                class="schedule-recent-match-container"
                id="recent-matches"
              ></div>
            </div>

            <div class="schedule-upcoming-matches">
              <div class="schedule-matches-text">Upcoming Matches</div>
              <div
                class="schedule-upcoming-match-container"
                id="upcoming-matches"
              ></div>
            </div>
          </div>

          <div class="schedule-comingUp-match">
            <div class="schedule-matches-text">Coming up next</div>
            <div class="schedule-comingUp-box">
              <div class="schedule-comingUp-match-box" id="coming-up-match">
                <div class="match">
                  <div class="match-box red">
                    <div class="match-flag"></div>
                    <div class="match-team"></div>
                    <div class="match-score"></div>
                  </div>
                  <div class="match-box blue">
                    <div class="match-flag"></div>
                    <div class="match-team"></div>
                    <div class="match-score"></div>
                  </div>
                </div>
              </div>
              <div class="round-name" id="round-name">Round of 32</div>
              <div class="schedule-comingUp-teamsVs" id="coming-up-teams"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="sponsors">
        <img
          class="acrid-sponsor"
          src="../_shared/assets/sponsors/Acrid Covers Logo Beige.png"
        />
        <img
          class="kagami-sponsor"
          src="../_shared/assets/sponsors/Kagami Studio Logo Beige.png"
        />
        <img
          class="sliderpals-sponsor"
          src="../_shared/assets/sponsors/SliderPals Logo Beige.png"
        />
      </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
      <section class="sidebar-section">
        <h1>Schedule</h1>
        <div class="sidebar-button-container">
          <button class="update-button" id="refresh-schedule">UPDATE</button>
        </div>
      </section>
    </div>

    <script src="index.js" type="module"></script>
    <script src="../_shared/core/sponsors.js"></script>
  </body>
</html>
