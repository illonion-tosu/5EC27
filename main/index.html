<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gameplay</title>

    <link rel="stylesheet" href="../_shared/css/common.css">
    <link rel="stylesheet" href="style.css">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="overlay">
        <div class="background-image"></div>

        <!-- Team Sections -->
        <div class="team-section left-team-section">
            <div class="team-seed">#3</div>
            <div class="team-section-inner">
                <div class="team-name-flag">
                    <img class="team-flag" src="https://osuflags.omkserver.nl/ES-1000.png">
                    <div class="team-name">Spain</div>
                </div>
                <div class="team-star-container">
                    <img src="../_shared/assets/star/star-fill.png">
                    <img src="../_shared/assets/star/star-fill.png">
                    <img src="../_shared/assets/star/star-fill.png">
                    <img src="../_shared/assets/star/star-fill.png">
                    <img src="../_shared/assets/star/star-fill.png">
                    <img src="../_shared/assets/star/star-fill.png">
                    <img src="../_shared/assets/star/star-empty.png">
                    <img src="../_shared/assets/star/star-empty.png">
                </div>
            </div>
        </div>
        <div class="team-section right-team-section">
            <div class="team-seed">#12</div>
            <div class="team-section-inner">
                <div class="team-name-flag right-team-name-flag">
                    <img class="team-flag" src="https://osuflags.omkserver.nl/PL-1000.png">
                    <div class="team-name">Poland</div>
                </div>
                <div class="team-star-container right-team-star-container">
                    <img src="../_shared/assets/star/star-fill.png">
                    <img src="../_shared/assets/star/star-fill.png">
                    <img src="../_shared/assets/star/star-fill.png">
                    <img src="../_shared/assets/star/star-fill.png">
                    <img src="../_shared/assets/star/star-fill.png">
                    <img src="../_shared/assets/star/star-fill.png">
                    <img src="../_shared/assets/star/star-empty.png">
                    <img src="../_shared/assets/star/star-empty.png">
                </div>
            </div>
        </div>

        <!-- Round Name -->
        <div class="round-name">Round of 32</div>

        <!-- Score Bar -->
        <div class="score-bar score-bar-left"></div>
        <div class="score-bar score-bar-right"></div>

        <!-- Scores -->
        <div class="score score-left score-lead">345,432</div>
        <div class="score score-right">345,432</div>
    </div>
    <script type="module" src="index.js"></script>
</body>
</html>
