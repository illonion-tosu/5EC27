<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winner</title>

    <link rel="stylesheet" href="../_shared/css/common.css">
    <link rel="stylesheet" href="style.css">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">

    <script src="../_shared/deps/jquery-4.0.0.min.js"></script>
</head>
<body>
    <div class="overlay">
        <div class="background-image"></div>
        <div class="round-name" id="round-name">Round of 32</div>
        <div class="team-data">
            <img class="team-flag" id="team-flag" src="https://osuflags.omkserver.nl/ES-1000.png">
            <div class="team-name" id="team-name">United States</div>
            <div class="player-names">
                <div class="player-names-wrapper player-names-left">
                    <div class="player-name" id="player-name-1">AAAAAAAAAAAAAAA</div>
                    <div class="player-name" id="player-name-3">Player 3</div>
                    <div class="player-name" id="player-name-5">Player 5</div>
                    <div class="player-name" id="player-name-7">Player 7</div>
                </div>
                <div class="player-names-wrapper player-names-right">
                    <div class="player-name" id="player-name-2">Player 2</div>
                    <div class="player-name" id="player-name-4">Player 4</div>
                    <div class="player-name" id="player-name-6">Player 6</div>
                    <div class="player-name" id="player-name-8">Player 8</div>
                </div>
            </div>
        </div>

        <!-- Sponsors -->
        <div class="sponsors">
            <img class="acrid-sponsor" src="../_shared/assets/sponsors/Acrid Covers Logo Beige.png">
            <img class="kagami-sponsor" src="../_shared/assets/sponsors/Kagami Studio Logo Beige.png">
            <img class="sliderpals-sponsor" src="../_shared/assets/sponsors/SliderPals Logo Beige.png">
        </div>
    </div>

    <script src="../_shared/core/sponsors.js"></script>
    <script src="index.js" type="module"></script>
</body>
</html>
